version: '3.8'

services:
  sdr-triangulation:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./config:/app/config
      - ./exports:/app/exports
      - ./logs:/app/logs
    environment:
      - DEBUG=0
      - LOG_LEVEL=INFO
      - FLASK_APP=src.frontend.app
      - FLASK_DEBUG=0
      - DEMO_MODE=1  # Enable demo mode by default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - sdr-network

networks:
  sdr-network:
    driver: bridge 